name: TeamX
version: ${version}
description: ${description}
api-version: '1.20'
folia-supported: true

authors: [SyntaxDevTeam]
website: https://github.com/SyntaxDevTeam/TeamX
support:
  issues: https://github.com/SyntaxDevTeam/TeamX/issues
  updates: https://github.com/SyntaxDevTeam/TeamX/releases

localization:
  available: [en_US, pl_PL, fr_FR, es_ES, de_DE]
  default: en_US

main: pl.syntaxdevteam.teamx.TeamX
loader: pl.syntaxdevteam.teamx.loader.SyntaxLoader
has-open-classloader: false

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    VaultUnlocked:
      load: BEFORE
      required: false
      join-classpath: true
    PlotsX:
      load: BEFORE
      required: false
      join-classpath: true
    CleanerX:
      load: BEFORE
      required: false
      join-classpath: true

features:
  debug: true

permissions:
  teamx.fees.bypass:
    description: Bypass fees for clan name and tag changes.
    default: op
