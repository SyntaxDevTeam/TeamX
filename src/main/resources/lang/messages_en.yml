# Ver. 1.0.0
# Message formatting:
# You can use MiniMessage and Legacy (Minecraft) formatting.
# Examples of how to use MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Do not mix formats within a single message. If you use Legacy, do not insert MiniMessage formatting, otherwise, only the latter will be used.
# Mixing formatting types is only allowed if you use the FormatterX plugin from SyntaxDevTeam ;)

prefix: "<gradient:#00d1d1:#22667d:#00aaaa:#22667d:#00d1d1>[<b>TeamX</b>]</gradient>"

# Error handling messages
error:
  empty_name: "<red>Enter a team name.</red>"
  no_permission: "<red>You do not have permission to use this command.</red>"
  player_not_found: "<gold>Player with nickname <player> not found.</gold>"
  no_have_team: "<red>You do not belong to any team.</red>"
  not_found: "<red>No team found with the name <team_name>.</red>"
  player_already_in_team: "<red>Player <player> is already in a team.</red>"
  already_in_team: "<red>You are already in a team.</red>"
  player_not_in_team: "<red>Player <player> is not in a team.</red>"
  name_too_long: "<red>Team name is too long. It cannot exceed <limit> characters.</red>"
  banned_word: "<red>Please use appropriate team names!</red>"
  console: "<red>Only a player can use this command.</red>"

reload:
  success: "<green>Configuration reloaded successfully.</green>"
  fail: "<red>Failed to reload configuration.</red>"

team:
  create_failed: "<red>Could not create the team.</red>"
  create_usage: "<green>Correct usage: <gold>/team create <team_name> <team_description></gold>"
  create_exists: "<red>A team with the name <team_name> already exists.</red>"
  created: "<green>Team <team_name> has been created.</green>"
  rename_usage: "<green>Correct usage: <gold>/team rename <new_team_name></gold>"
  rename_exists: "<red>A team with the name <team_name> already exists.</red>"
  renamed: "<green>Team name changed to <team_name>.</green>"
  rename_failed: "<red>Failed to rename the team.</red>"
  description_usage: "<green>Correct usage: <gold>/team description <team_description></gold>"
  description_updated: "<green>Team description updated.</green>"
  description_failed: "<red>Could not update the clan description."
  leader_set: "<green>{player} is now the founder of {team_name}."
  set_leader_failed: "<red>Could not appoint {player} as founder of {team_name}."
  deleted: "<red>Your team <team_name> has been deleted.</red>"
  not_team_owner: "<red>You are not the team leader to complete this command.</red>"
  delete_failed: "<red>Failed to delete team <team_name>.</red>"
  admin_usage: "<green>Correct usage: <gold>/team admin adduser <team_name> <player></gold>"
  player_added: "<green>Player <player> added to team <team_name>.</green>"
  add_failed: "<red>Failed to add player <player> to team <team_name>.</red>"
  kick_usage: "<green>Correct usage: <gold>/team kick <player_name></gold>"
  player_removed: "<green>Player <player> removed from team <team_name>.</green>"
  you_kicked: "<red>You have been kicked from team <team_name>.</red>"
  remove_failed: "<red>Failed to remove player <player> from team <team_name>.</red>"
  player_leaved: "<green>You have left the team <team_name>.</green>"
  leave_failed: "<red>Failed to leave the team <team_name>.</red>"

invitation:
  usage: "<green>Correct usage: <gold>/team invite <player_name></gold>"
  received: "<white>You received a team invitation from <b><leader></b>. Click <click:run_command:'/team accept'><green>[Accept]</green></click> or <click:run_command:'/team deny'><red>[Deny]</red></click>"
  # received: "<white>You received a team invitation from <b><leader></b>. Type <gold>/team accept</gold> to accept or <gold>/team deny</gold> to decline."
  sent: "<green>Invitation sent to player <player>.</green>"
  sent_failed: "<red>Failed to send invitation to player <player>.</red>"
  accepted: "<green>Invitation accepted! You joined the team <team_name>.</green>"
  denied: "<red>Invitation declined.</red>"
  player_accepted: "<green>Player <player> accepted the invitation.</green>"
  player_denied: "<red>Player <player> declined the invitation.</red>"
  already_invited: "<red>Player <player> has already received a team invitation.</red>"
  expired: "<red>Your team invitation has expired.</red>"
  no_invitation: "<red>You do not have an active invitation.</red>"
  kick: "<red>You have been kicked from the team.</red>"

